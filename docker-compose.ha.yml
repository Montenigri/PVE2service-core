# High-availability deployment: 2+ replicas sharing Postgres and secrets.
#
#   docker compose -f docker-compose.ha.yml up -d
#
# Requirements for running multiple replicas:
#   - Postgres (shared state). SQLite cannot be shared between hosts/processes.
#   - Identical .pve2_secret and .pve2_encryption_key on every replica so
#     sessions and encrypted secrets validate everywhere. This file shares them
#     via a named volume; on multi-host deployments distribute the two key
#     files yourself (docker secrets / k8s secrets / scp).
#   - Scheduled jobs (sync, power, notify) use DB leases: only the lease holder
#     runs each job, so replicas do not duplicate actions.
#   - Put a reverse proxy in front (round-robin is fine) and forward the Host
#     header — the CSRF check compares Origin against it.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pve2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pve2pass}
      POSTGRES_DB: ${POSTGRES_DB:-pve2}
    volumes:
      - pve2_ha_db:/var/lib/postgresql/data
    networks:
      - pve2-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pve2}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pve2:
    image: pve2:latest
    build:
      context: ./
      dockerfile: PVE2Services/core/wiki_service/Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 2
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PVE2_DB_URL=postgresql://${POSTGRES_USER:-pve2}:${POSTGRES_PASSWORD:-pve2pass}@db:5432/${POSTGRES_DB:-pve2}
      - PVE2_SECRET_FILE=/run/secrets/pve2_secret
      - PVE2_ENCRYPTION_KEY_FILE=/run/secrets/pve2_encryption_key
      - PVE2_TRUST_XFF=true
    volumes:
      - pve2_secrets:/run/secrets
    networks:
      - pve2-net

  lb:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      - pve2
    configs:
      - source: lb_conf
        target: /etc/nginx/conf.d/default.conf
    networks:
      - pve2-net

configs:
  lb_conf:
    content: |
      upstream pve2 {
          server pve2:8000;
      }
      server {
          listen 80;
          location / {
              proxy_set_header Host $$host;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_pass http://pve2;
          }
      }

volumes:
  pve2_ha_db:
  pve2_secrets:

networks:
  pve2-net:
    driver: bridge
