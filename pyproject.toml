[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pve2"
version = "0.1.0"
description = "Proxmox Unified Management Platform — Connect your cluster to DNS, notifications, power scheduling, proxy, and wiki"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "PVE2 Services Contributors" },
]
keywords = ["proxmox", "ve", "homelab", "dns", "notifications", "wiki", "proxy", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.142.2,<1.0",
    "uvicorn[standard]>=0.54.0,<1.0",
    "httpx>=0.28.1,<1.0",
    "jinja2>=3.1.6,<4.0",
    "apscheduler>=3.11.3,<4.0",
    "python-dotenv>=1.2.4,<2.0",
    "sqlalchemy>=2.1.1,<3.0",
    "psycopg2-binary>=2.9.13,<3.0",
    "bcrypt>=5.0.0,<6.0",
    "cryptography>=50.0.2,<51.0",
    "pydantic>=2.13.5,<3.0",
    "pyyaml>=6.0.3,<7.0",
    "packaging>=26.3,<27.0",
    "boto3>=1.43.106,<2.0",
]

[project.optional-dependencies]
test = ["pytest", "httpx", "moto[s3]>=5.2.3,<6.0"]
dev = ["ruff>=0.16.9,<1.0", "pytest", "httpx", "moto[s3]>=5.2.3,<6.0"]

[project.scripts]
# Build/sign/publish plugin packages to the store and generate signing keys.
# Shipped with the core so the plugin repo can run them from the wheel.
pve2-build-plugin = "PVE2Services.libs.plugin_build:main"
pve2-generate-keys = "PVE2Services.libs.plugin_keys:main"

[project.urls]
Homepage = "https://github.com/Montenigri/pve2service-core"
Repository = "https://github.com/Montenigri/pve2service-core"
Issues = "https://github.com/Montenigri/pve2service-core/issues"
Documentation = "https://github.com/Montenigri/pve2service-core/blob/main/docs/TECHNICAL.md"
Changelog = "https://github.com/Montenigri/pve2service-core/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
# The import package is nested one level below the repo root.
include = ["PVE2Services*"]

[tool.setuptools.package-data]
"PVE2Services.core.wiki_service.app" = ["templates/*"]
# Ship the public signing key inside the package so `pip install pve2` can
# verify plugin-store signatures without a repo checkout.
"PVE2Services" = ["keys/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# The core package and repo tooling are first-party in this checkout.
known-first-party = ["PVE2Services", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]

