name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Run ruff
        run: |
          ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        db_mode: [sqlite, postgres_docker]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pve2
          POSTGRES_PASSWORD: pve2pass
          POSTGRES_DB: pve2
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pve2 -d pve2"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          PVE2_DB_MODE: ${{ matrix.db_mode }}
          PVE2_DB_URL: ${{ matrix.db_mode == 'postgres_docker' && 'postgresql://pve2:pve2pass@127.0.0.1:5432/pve2' || '' }}
        run: |
          pytest -q tests
