version: 2
updates:
  # Runtime + dev Python deps: one grouped PR per week.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 3
    groups:
      python-deps:
        patterns: ["*"]

  # All GitHub Actions bumps in a single PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]

  # Docker base images in the core Dockerfile.
  - package-ecosystem: docker
    directory: "/PVE2Services/core/wiki_service"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 2
    groups:
      docker-images:
        patterns: ["*"]
