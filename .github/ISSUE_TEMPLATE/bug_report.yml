name: Bug report
description: Report a reproducible bug in PVE2Services Core
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. For **security** issues do
        **not** open a public issue — use the repository's Security tab instead.
  - type: input
    id: version
    attributes:
      label: PVE2 version
      description: Core version / Docker image tag / commit SHA.
      placeholder: "0.1.0 or ghcr.io/...:v0.1.0 or abc1234"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How are you running it?
      options:
        - Docker Compose (SQLite)
        - Docker Compose (PostgreSQL)
        - Docker HA compose (replicas)
        - From source (uvicorn)
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version (only for source installs)
      placeholder: "3.12"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      description: |
        Paste logs from `docker compose logs core` (redact secrets, tokens,
        IPs and hostnames). Set `PVE2_LOG_LEVEL=DEBUG` if useful.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I redacted credentials, tokens and private hostnames from the report.
          required: true
        - label: This is not a security vulnerability (those go through the Security tab).
          required: true
